<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5ff5" />
    <meta
      name="description"
      content="MERCADO VIVO — simulador económico e empresarial multijogador. Moeda 100% virtual em euros, sem valor real."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>MERCADO VIVO — Simulador Económico</title>
  </head>
  <body class="bg-surface-light dark:bg-surface-dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registo do Service Worker (PWA)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {
            /* offline SW indisponível em dev */
          });
        });
      }
    </script>
  </body>
</html>
